name: Build voxtts APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Rename and Prepare APK
      run: |
        mkdir -p output/
        cp app/build/outputs/apk/debug/app-debug.apk output/voxtts-debug.apk

    - name: Upload voxtts APK
      uses: actions/upload-artifact@v4
      with:
        name: voxtts-debug-apk
        path: output/voxtts-debug.apk
        
