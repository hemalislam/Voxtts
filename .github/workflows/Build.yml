name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4.2.2 # Fixed Node.js warning

    - name: Set up JDK 17
      uses: actions/setup-java@v4.5.0 # Fixed Node.js warning
      with:
        distribution: 'temurin'
        java-version: '17'
        # Removed the cache option to prevent the 'Cache service 400' error

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace # Added stacktrace to see exact errors if it fails

    - name: Upload APK Artifact
      if: success() # Only run this if the build actually succeeds
      uses: actions/upload-artifact@v4.5.0
      with:
        name: my-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
